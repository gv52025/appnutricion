name: Comprobación diaria de Supabase

on:
  schedule:
    # 07:23 America/Merida (UTC-6). Avoid the top of the hour.
    - cron: '23 13 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-healthcheck
  cancel-in-progress: false

jobs:
  database:
    name: Consulta mínima de solo lectura
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_HEALTH_URL }}
      SUPABASE_PUBLIC_KEY: ${{ vars.SUPABASE_HEALTH_PUBLIC_KEY }}
    steps:
      - name: Comprobar respuesta de PostgreSQL
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ.get('SUPABASE_URL', '').rstrip('/')
          key = os.environ.get('SUPABASE_PUBLIC_KEY', '')
          if base != 'https://qcravvwtqjfbbemvjlec.supabase.co' or not key:
              raise SystemExit('Falta la URL o la clave pública de comprobación en las variables de Actions.')
          endpoint = base + '/rest/v1/rpc/nutricion_database_healthcheck'
          results = []
          # Three small probes in a single daily run. No patient queries.
          for probe in range(3):
              started = time.monotonic()
              for attempt in range(3):
                  request = urllib.request.Request(endpoint, data=b'{}', method='POST', headers={
                      'apikey': key,
                      'Authorization': 'Bearer ' + key,
                      'Content-Type': 'application/json',
                      'Accept': 'application/json',
                  })
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          payload = json.loads(response.read(1024))
                      if type(payload) is not int or payload != 1:
                          raise ValueError('Respuesta inesperada de la comprobación.')
                      break
                  except (urllib.error.URLError, TimeoutError, ValueError) as error:
                      # Never log headers, credentials, or response bodies.
                      status = error.code if isinstance(error, urllib.error.HTTPError) else type(error).__name__
                      print(f'Consulta {probe + 1}, intento {attempt + 1}: fallo ({status}).')
                      if attempt == 2:
                          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                              summary.write('## Comprobación fallida\nLa base no confirmó disponibilidad. Revisar el proyecto en Supabase.\n')
                          raise SystemExit(1)
                      time.sleep(5 * (attempt + 1))
              results.append(round(time.monotonic() - started, 3))
              print(f'Consulta {probe + 1}/3 correcta: {results[-1]} segundos.')
              if probe < 2:
                  time.sleep(2)
          checked = datetime.datetime.now(datetime.timezone.utc).isoformat()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## Supabase responde correctamente\n\nFecha UTC: {checked}\n\n')
              summary.write('Tres consultas de disponibilidad completadas. Sin lectura de expedientes ni modificación de datos.\n\n')
              summary.write('Duraciones (s): ' + ', '.join(map(str, results)) + '\n')
          PY
